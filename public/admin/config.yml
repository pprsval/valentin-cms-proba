backend:
  name: turbo-github
  turbo_site_id: 3f1a3281-fb7e-4c7d-810e-c4049cc91122
publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: ../../uploads
locale: hu
collections:
  - name: projects
    label: Projektek
    folder: src/pages/projects
    create: true
    preview_path: 'projects/{{slug}}/'
    fields:
      - {name: layout, widget: hidden, default: ../../layouts/Entry.astro}
      - {name: title, label: Cím, widget: string}
      - {name: date, label: Dátum, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD}
      - {name: category, label: Kategória, widget: select, options: [CAD, Piping, Documentation, Automation]}
      - {name: description, label: Bevezető, widget: text}
      - {name: cover, label: Borítókép, widget: image, required: false}
      - {name: body, label: Szöveg, widget: markdown}
      - name: gallery
        label: Galéria
        widget: list
        required: false
        summary: '{{fields.caption}}'
        fields:
          - {name: image, label: Kép, widget: image}
          - {name: alt, label: Képleírás, widget: string}
          - {name: caption, label: Képaláírás, widget: string}
      - {name: pdf, label: PDF, widget: file, required: false, media_library: {config: {multiple: false}}}
  - name: blog
    label: Angol cikkek
    folder: src/pages/blog
    create: true
    preview_path: 'blog/{{slug}}/'
    fields:
      - {name: layout, widget: hidden, default: ../../layouts/Entry.astro}
      - {name: title, label: Cím, widget: string}
      - {name: date, label: Dátum, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD}
      - {name: category, label: Kategória, widget: select, options: [CAD, Piping, Documentation, Automation]}
      - {name: description, label: Bevezető, widget: text}
      - {name: cover, label: Borítókép, widget: image, required: false}
      - {name: body, label: Szöveg, widget: markdown}
  - name: hu
    label: Magyar fordítások
    folder: src/pages/hu
    create: true
    preview_path: 'hu/{{slug}}/'
    fields:
      - {name: layout, widget: hidden, default: ../../layouts/Entry.astro}
      - {name: title, label: Cím, widget: string}
      - {name: date, label: Dátum, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD}
      - {name: category, label: Kategória, widget: select, options: [CAD, Piping, Documentation, Automation]}
      - {name: description, label: Bevezető, widget: text}
      - {name: cover, label: Borítókép, widget: image, required: false}
      - {name: body, label: Szöveg, widget: markdown}
      - {name: original, label: Angol eredeti, widget: relation, collection: blog, search_fields: [title], display_fields: [title], value_field: "{{slug}}"}

  - name: settings
    label: Oldalbeállítások
    files:
      - name: homepage
        label: Főoldal
        file: homepage.json
        format: json
        preview_path: /
        fields:
          - {name: title, label: Főcím, widget: string}
          - {name: description, label: Bemutatkozás, widget: text}
          - {name: portrait, label: Portré, widget: image, required: false}
          - {name: works, label: Projektek bevezetője, widget: text}
          - name: featured
            label: Kiemelt tartalmak
            widget: list
            typeKey: type
            min: 2
            max: 3
            summary: '{{fields.slug}}'
            default:
              - {type: project, slug: urban-k1}
              - {type: project, slug: sample-plate}
            types:
              - name: project
                label: Projekt
                widget: object
                fields:
                  - {name: slug, label: Projekt címe, widget: relation, collection: projects, search_fields: [title], display_fields: [title], value_field: '{{slug}}'}
              - name: article
                label: Blogcikk
                widget: object
                fields:
                  - {name: slug, label: Cikk címe, widget: relation, collection: blog, search_fields: [title], display_fields: [title], value_field: '{{slug}}'}
